# ============================================================
# BrainBrush Secrets — Sensitive Configuration
# ============================================================
# Secrets store sensitive data (passwords, API keys, tokens).
# Values are base64-encoded (NOT encrypted — use RBAC + encryption
# at rest in production).
#
# To encode a value:  echo -n 'your_value' | base64
# To decode a value:  echo 'base64_string' | base64 -d
#
# ⚠️ IMPORTANT: Replace placeholder values before deploying!
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: brainbrush-secrets
  namespace: brainbrush
  labels:
    app: brainbrush
type: Opaque
data:
  # echo -n 'your_mongodb_connection_string' | base64
  MONGO_URI: eW91cl9tb25nb2RiX2Nvbm5lY3Rpb25fc3RyaW5n
  # echo -n 'your_redis_connection_string' | base64
  REDIS_URL: eW91cl9yZWRpc19jb25uZWN0aW9uX3N0cmluZw==
  # echo -n 'your_google_client_id' | base64
  GOOGLE_CLIENT_ID: eW91cl9nb29nbGVfY2xpZW50X2lk
  # echo -n 'your_google_client_secret' | base64
  GOOGLE_CLIENT_SECRET: eW91cl9nb29nbGVfY2xpZW50X3NlY3JldA==
  # echo -n 'your_jwt_secret' | base64
  JWT_SECRET: eW91cl9qd3Rfc2VjcmV0
