# ============================================================
# BrainBrush ConfigMap — Non-Secret Configuration
# ============================================================
# ConfigMaps store non-sensitive configuration that can change
# between environments without rebuilding the Docker image.
#
# Unlike Secrets, these values are stored in plain text.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: brainbrush-config
  namespace: brainbrush
  labels:
    app: brainbrush
data:
  PORT: "5000"
  NODE_ENV: "production"
  FRONTEND_URL: "http://brainbrush.example.com"
  ALLOWED_ORIGINS: "http://brainbrush.example.com"
