# ============================================================
# BrainBrush Backend — Kubernetes Deployment + Service
# ============================================================
#
# Deployment: Manages 3 replicas of the backend container.
#   - Rolling update strategy (zero-downtime deployments)
#   - Liveness probe: Restarts container if /health fails
#   - Readiness probe: Removes from load balancer if not ready
#   - Resource limits: Prevents a single pod from consuming all resources
#
# Service: Exposes the backend internally within the cluster
#   via ClusterIP on port 5000.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: brainbrush
  labels:
    app: brainbrush
    component: backend
spec:
  replicas: 3                           # Run 3 instances for high availability
  selector:
    matchLabels:
      app: brainbrush
      component: backend

  # Rolling Update Strategy:
  # - maxSurge: 1 → Create 1 extra pod before killing old ones
  # - maxUnavailable: 0 → Never have fewer than 3 pods running
  # This ensures zero-downtime deployments.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: brainbrush
        component: backend
    spec:
      containers:
        - name: backend
          image: caliber001/brainbrush-backend:latest
          ports:
            - containerPort: 5000
              name: http

          # Environment variables from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: brainbrush-config
            - secretRef:
                name: brainbrush-secrets

          # Liveness Probe:
          # "Is the container alive?" → If this fails 3 times, K8s RESTARTS the container.
          # Checks /health endpoint every 30 seconds.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30       # Wait 30s after startup before first check
            periodSeconds: 30             # Check every 30 seconds
            timeoutSeconds: 5             # Timeout after 5 seconds
            failureThreshold: 3           # Restart after 3 consecutive failures

          # Readiness Probe:
          # "Is the container ready to receive traffic?" → If this fails,
          # K8s removes the pod from the Service (no traffic routed to it).
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10       # Wait 10s before first check
            periodSeconds: 10             # Check every 10 seconds
            timeoutSeconds: 5
            failureThreshold: 3

          # Resource Limits:
          # requests = guaranteed resources (used for scheduling)
          # limits = maximum resources (pod is killed if it exceeds memory limit)
          resources:
            requests:
              cpu: "250m"                 # 0.25 CPU cores guaranteed
              memory: "256Mi"             # 256 MB RAM guaranteed
            limits:
              cpu: "500m"                 # Max 0.5 CPU cores
              memory: "512Mi"             # Max 512 MB RAM (OOMKilled if exceeded)

---
# ── Backend Service ──
# ClusterIP: Only accessible within the cluster.
# Other pods (frontend, monitoring) connect to backend:5000.

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: brainbrush
  labels:
    app: brainbrush
    component: backend
spec:
  type: ClusterIP
  selector:
    app: brainbrush
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
