---
- name: Provision BrainBrush Server

  hosts: servers

  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600    # Don't re-update if cache is less than 1 hour old

    - name: Upgrade all packages to latest version
      ansible.builtin.apt:
        upgrade: dist

    - name: Install required packages for Docker setup
      ansible.builtin.apt:
        name:
          - ca-certificates       # For HTTPS certificate verification
          - curl                  # For downloading Docker's GPG key
          - gnupg                 # For verifying package signatures
          - lsb-release           # For detecting Ubuntu version
          - apt-transport-https   # For fetching packages over HTTPS
        state: present

    - name: Create Docker keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get system architecture
      ansible.builtin.command: dpkg --print-architecture
      register: arch_result
      changed_when: false

    - name: Add Docker repository to apt sources
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: [https://download.docker.com/linux/ubuntu]
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: ["{{ arch_result.stdout }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce             # Docker Engine (the core runtime)
          - docker-ce-cli         # Docker CLI (the `docker` command)
          - containerd.io         # Container runtime Docker uses under the hood
          - docker-buildx-plugin  # For building multi-platform images
          - docker-compose-plugin # Docker Compose V2 (the `docker compose` command)
        state: present
        update_cache: true

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: /home/ubuntu/brainbrush
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Verify Docker is working
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Print Docker version
      ansible.builtin.debug:
        msg: "Docker installed successfully: {{ docker_version.stdout }}"

    - name: Verify Docker Compose is working
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Print Docker Compose version
      ansible.builtin.debug:
        msg: "Docker Compose installed: {{ compose_version.stdout }}"
