# ============================================================
# BrainBrush CI/CD Pipeline
# ============================================================
#
# End-to-end pipeline: Source → Build → Test → Containerize → Deploy → Verify
#
# Triggers on:
#   - Push to main branch
#   - Pull requests to main branch
#
# Pipeline stages:
#   1. SOURCE:        Checkout code, setup Node.js, cache dependencies
#   2. BUILD:         Install deps (npm ci), compile TypeScript (tsc)
#   3. TEST:          Run Jest unit tests — fails pipeline on test failure
#   4. CONTAINERIZE:  Build Docker images, push to Docker Hub
#   5. DEPLOY:        SSH into EC2, pull images, docker compose up
#   6. VERIFY:        Hit /health endpoint to confirm deployment
# ============================================================


# ============================================================
# BrainBrush CI/CD: Build -> Test -> Docker -> Ansible -> Verify
# ============================================================

name: BrainBrush CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_HUB_USER: caliber001
  BACKEND_IMAGE: caliber001/brainbrush-backend
  FRONTEND_IMAGE: caliber001/brainbrush-frontend

jobs:
  # STAGE 1-3: Build and test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

  # STAGE 4: Build and push Docker images
  dockerize:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAGE 5: Deploy using Ansible
  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    needs: dockerize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write the EC2 private key
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/brainbrush.pem"
          chmod 600 "$HOME/.ssh/brainbrush.pem"

          # Validate required inputs
          test -s "$HOME/.ssh/brainbrush.pem"
          test -n "$EC2_HOST"

          # Validate the key format
          ssh-keygen -y -f "$HOME/.ssh/brainbrush.pem" > /dev/null

          # Fetch the EC2 host key; retry briefly if networking is slow
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" \
                >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not retrieve the EC2 SSH host key."
              exit 1
            fi
            sleep 3
          done

          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Create a temporary Ansible inventory
          {
            echo '[servers]'
            printf 'brainbrush ansible_host=%s ansible_user=ubuntu ansible_ssh_private_key_file=%s\n' \
              "$EC2_HOST" "$HOME/.ssh/brainbrush.pem"
            echo
            echo '[servers:vars]'
            echo 'ansible_python_interpreter=/usr/bin/python3'
          } > "$RUNNER_TEMP/inventory.ini"

          echo "SSH configuration and key validation succeeded."

      - name: Create temporary Ansible variables
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          variables = {
              "mongo_uri": os.environ["MONGO_URI"],
              "redis_url": os.environ["REDIS_URL"],
              "google_client_id": os.environ["GOOGLE_CLIENT_ID"],
              "google_client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "jwt_secret": os.environ["JWT_SECRET"],
              "frontend_url": os.environ["FRONTEND_URL"],
              "docker_hub_user": os.environ["DOCKERHUB_USERNAME"],
              "docker_hub_password": os.environ["DOCKERHUB_TOKEN"],
              "docker_image_tag": "latest"
          }

          path = Path(os.environ["RUNNER_TEMP"]) / "ansible-vars.json"
          path.write_text(json.dumps(variables), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Deploy application with Ansible
        run: |
          ansible-playbook \
            -i "$RUNNER_TEMP/inventory.ini" \
            ansible/deploy.yml \
            --extra-vars "@$RUNNER_TEMP/ansible-vars.json"

      - name: Remove temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ansible-vars.json"
          rm -f "$RUNNER_TEMP/inventory.ini"
          rm -f ~/.ssh/brainbrush.pem

  # STAGE 6: Verify deployment
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check backend health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -eu
          echo "Waiting for backend to become ready..."

          for attempt in $(seq 1 12); do
            status=$(curl --silent --output /tmp/health.json \
              --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 \
              "${BACKEND_URL%/}/health" || true)

            if [ "$status" = "200" ]; then
              echo "Backend health check passed."
              cat /tmp/health.json
              exit 0
            fi

            echo "Attempt $attempt/12 returned HTTP ${status:-000}; retrying..."
            sleep 5
          done

          echo "Backend health check failed."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
