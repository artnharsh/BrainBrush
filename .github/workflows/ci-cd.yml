# ============================================================
# BrainBrush CI/CD Pipeline
# ============================================================
#
# End-to-end pipeline: Source → Build → Test → Containerize → Deploy → Verify
#
# Triggers on:
#   - Push to main branch
#   - Pull requests to main branch
#
# Pipeline stages:
#   1. SOURCE:        Checkout code, setup Node.js, cache dependencies
#   2. BUILD:         Install deps (npm ci), compile TypeScript (tsc)
#   3. TEST:          Run Jest unit tests — fails pipeline on test failure
#   4. CONTAINERIZE:  Build Docker images, push to Docker Hub
#   5. DEPLOY:        SSH into EC2, pull images, docker compose up
#   6. VERIFY:        Hit /health endpoint to confirm deployment
# ============================================================

name: BrainBrush CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_USER: caliber001
  BACKEND_IMAGE: caliber001/brainbrush-backend
  FRONTEND_IMAGE: caliber001/brainbrush-frontend

jobs:
  # ──────────────────────────────────────────────
  # STAGE 1-3: Source → Build → Test
  # ──────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── STAGE 1: SOURCE ──
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache node_modules to speed up subsequent runs
      - name: 📦 Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: 📦 Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # ── STAGE 2: BUILD ──
      - name: 🔧 Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: 🔧 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Compile backend TypeScript
        working-directory: backend
        run: npm run build

      - name: 🏗️ Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      # ── STAGE 3: TEST ──
      - name: 🧪 Run backend unit tests
        working-directory: backend
        run: npm test

  # ──────────────────────────────────────────────
  # STAGE 4: Containerize (Docker Build & Push)
  # ──────────────────────────────────────────────
  dockerize:
    name: 🐳 Containerize & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push backend image with two tags:
      #   - latest (always points to newest build)
      #   - commit SHA (for rollback capability)
      - name: 🏗️ Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # STAGE 5-6: Deploy & Verify
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: dockerize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # ── STAGE 5: DEPLOY ──
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦 Pulling latest images..."
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            echo "🔄 Restarting containers..."
            cd ~/brainbrush
            docker compose down
            docker compose up -d

            echo "🧹 Cleaning up old images..."
            docker image prune -af

            echo "✅ Deployment complete!"

      # ── STAGE 6: VERIFY ──
      - name: ✅ Verify deployment (Health Check)
        run: |
          echo "⏳ Waiting 15 seconds for containers to start..."
          sleep 15

          echo "🔍 Checking backend health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}:5000/health || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Backend is healthy! (HTTP $HTTP_STATUS)"
          elif [ "$HTTP_STATUS" = "503" ]; then
            echo "⚠️ Backend is up but database not connected (HTTP $HTTP_STATUS)"
          else
            echo "❌ Health check failed! (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo ""
          echo "📊 Full health response:"
          curl -s http://${{ secrets.EC2_HOST }}:5000/health | python3 -m json.tool || true
